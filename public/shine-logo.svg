<svg xmlns="http://www.w3.org/2000/svg" width="480" height="100" viewBox="0 0 480 100" role="img">
  <title>SHINE Fashion House</title>
  <desc>SHINE logo with 4-point star marks, minimalist modern serif wordmark</desc>

  <!-- rules -->
  <line x1="0" y1="8" x2="480" y2="8" stroke="currentColor" stroke-width="0.8" opacity="0.25"/>
  <line x1="0" y1="92" x2="480" y2="92" stroke="currentColor" stroke-width="0.8" opacity="0.25"/>

  <!-- diamond accent top-center -->
  <polygon points="240,12 243,17 240,22 237,17" fill="currentColor" opacity="0.3"/>

  <!-- star left -->
  <g transform="translate(38, 50)">
    <path d="M0,-13 L3.2,-3.2 L13,0 L3.2,3.2 L0,13 L-3.2,3.2 L-13,0 L-3.2,-3.2 Z" fill="currentColor"/>
    <circle cx="0" cy="0" r="2.8" fill="white"/>
  </g>

  <!-- wordmark -->
  <text
    x="240" y="68"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="52"
    font-weight="400"
    fill="currentColor"
    letter-spacing="16"
    text-anchor="middle">SHINE</text>

  <!-- star right -->
  <g transform="translate(442, 50)">
    <path d="M0,-13 L3.2,-3.2 L13,0 L3.2,3.2 L0,13 L-3.2,3.2 L-13,0 L-3.2,-3.2 Z" fill="currentColor"/>
    <circle cx="0" cy="0" r="2.8" fill="white"/>
  </g>

  <!-- tagline -->
  <text
    x="240" y="84"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="7"
    font-weight="400"
    fill="currentColor"
    letter-spacing="5.5"
    text-anchor="middle"
    opacity="0.5">FASHION HOUSE</text>

</svg>
